name: Livecore
options:
  bundleIdPrefix: com.berkegulacar
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 345USFAYPB
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Livecore:
    type: application
    platform: macOS
    sources:
      - path: Livecore
        excludes:
          - AerialIntegration.swift
    entitlements:
      path: Livecore/Livecore.entitlements
    info:
      path: Livecore/Info.plist
      properties:
        CFBundleDisplayName: Livecore
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "200"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    dependencies:
      - target: LivecoreWallpaperExtension
        embed: true
  LivecoreWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: LivecoreWallpaperExtension
    entitlements:
      path: LivecoreWallpaperExtension/LivecoreWallpaperExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: LivecoreWallpaperExtension/Info.plist
      properties:
        CFBundleDisplayName: Livecore Wallpaper
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "200"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.wallpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkegulacar.Livecore.wallpaper-extension
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_OBJC_BRIDGING_HEADER: LivecoreWallpaperExtension/RuntimeBridge.h
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../../../../Frameworks'
schemes:
  Livecore:
    build:
      targets:
        Livecore: all
    run:
      config: Debug
    archive:
      config: Release
